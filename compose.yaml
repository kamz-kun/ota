services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hot_updater
      POSTGRES_PASSWORD: hot_updater
      POSTGRES_USER: hot_updater
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hot_updater -d hot_updater"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hot_updater:hot_updater@postgres:5432/hot_updater
      HOT_UPDATER_AUTH_TOKEN: ${HOT_UPDATER_AUTH_TOKEN:?Set HOT_UPDATER_AUTH_TOKEN in .env}
      PORT: 80
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
